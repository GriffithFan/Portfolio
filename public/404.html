<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Página no encontrada · Ulises Lazarte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz@6..72&display=swap" rel="stylesheet" />
    <style>
      :root { --paper: #F6F5F1; --ink: #161614; --muted: #585752; --faint: #84837D; --line: #DEDCD5; --accent: #C2410C; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #111110; --ink: #ECEBE7; --muted: #A6A59E; --faint: #76756F; --line: #2C2C29; --accent: #F28C45; }
      }
      * { margin: 0; box-sizing: border-box; }
      body { min-height: 100vh; display: flex; align-items: center; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: 100%; max-width: 68rem; margin: 0 auto; padding: 0 1.25rem; }
      .code { font-family: 'IBM Plex Mono', monospace; font-size: .75rem; color: var(--faint); margin-bottom: 1.5rem; }
      h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -0.02em; line-height: 1; margin-bottom: 1.25rem; }
      p { color: var(--muted); font-size: 1.0625rem; line-height: 1.6; max-width: 34rem; margin-bottom: 2rem; }
      a { display: inline-block; background: var(--ink); color: var(--paper); padding: .75rem 1.25rem; font-size: .875rem; font-weight: 500; text-decoration: none; }
      a:hover { background: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="code">Error 404</div>
      <h1>Esta página no existe.</h1>
      <p>La dirección puede estar mal escrita o la página se movió.</p>
      <a href="/">Ir al inicio</a>
    </main>
  </body>
</html>
